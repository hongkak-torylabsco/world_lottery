<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>피드백 및 질문 | World Lottery</title>
  <meta name="description" content="World Lottery에 오류를 제보하거나 개선을 제안하고 이용 방법을 문의할 수 있습니다.">
  <link rel="canonical" href="https://world-lottery.pages.dev/contact">
  <link rel="stylesheet" href="style.css">
  <script src="contact.js" defer></script>
</head>
<body>
  <main class="information-page">
    <nav class="information-nav" aria-label="World Lottery">
      <a href="index.html" id="home-link">번호 생성기</a>
      <a href="about.html" id="about-link">사이트 소개</a>
      <a href="guide.html" id="guide-link">이용 안내</a>
      <a href="privacy.html" id="privacy-link">개인정보처리방침</a>
    </nav>
    <article class="card information-content">
      <h1 id="contact-title">피드백 및 질문</h1>
      <nav class="information-nav" aria-label="Language">
        <a href="?lang=ko#ko" lang="ko" aria-current="true">한국어</a>
        <a href="?lang=en#en" lang="en">English</a>
        <a href="?lang=ja#ja" lang="ja">日本語</a>
        <a href="?lang=pt-BR#pt-BR" lang="pt-BR">Português (Brasil)</a>
      </nav>
      <p id="contact-intro">오류를 제보하거나 개선을 제안하고, 사이트 이용에 대해 질문할 수 있습니다. 제출 내용은 운영자가 확인합니다.</p>
      <form id="contact-form" hidden novalidate>
        <fieldset id="contact-fields">
          <label for="contact-type" id="type-label">유형</label>
          <select id="contact-type" name="type" required>
            <option value="feedback">피드백</option>
            <option value="question">질문</option>
          </select>
          <label for="contact-category" id="category-label">분류</label>
          <select id="contact-category" name="category">
            <option value="general">일반</option>
            <option value="bug">오류 신고</option>
            <option value="rules">복권 규칙</option>
            <option value="other">기타</option>
          </select>
          <label for="contact-subject" id="subject-label">제목 (선택)</label>
          <input id="contact-subject" name="title" maxlength="150">
          <label for="contact-email" id="email-label">답변 받을 이메일 (선택)</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254">
          <label for="contact-message" id="message-label">내용</label>
          <textarea id="contact-message" name="message" required maxlength="3000" rows="7" aria-describedby="contact-note"></textarea>
          <p id="contact-note">최대 3,000자까지 입력할 수 있습니다. 비밀번호나 복권 사진 같은 민감한 정보는 보내지 마세요.</p>
          <div hidden><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
          <div id="contact-verification"></div>
          <button type="submit" id="contact-submit" class="btn btn-primary" disabled>보내기</button>
        </fieldset>
      </form>
      <p id="contact-status" role="status" aria-live="polite"></p>
      <dialog id="contact-receipt" aria-labelledby="receipt-title" aria-describedby="receipt-reference">
        <h2 id="receipt-title">전송 완료</h2>
        <p id="receipt-reference" class="feedback-text"></p>
        <button type="button" id="receipt-done" class="btn btn-primary" autofocus>완료</button>
      </dialog>
      <p><a id="public-qa" href="/questions/">공개 질문과 답변</a></p>
      <p><a id="public-issues" href="https://github.com/hongkak-torylabsco/world_lottery/issues">공개 GitHub 이슈 보기</a></p>
      <noscript><p>문의 양식을 사용하려면 JavaScript를 켜 주세요. / Enable JavaScript to use the contact form.</p></noscript>
    </article>
  </main>
</body>
</html>
